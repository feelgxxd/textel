name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run site:build
      - name: The playground bundle defines the viewer
        shell: bash
        run: grep -qE 'customElements\.define\(.textel-viewer' site-dist/assets/*.js
      - name: Smoke test the built CLI
        shell: bash
        run: |
          node dist/cli/main.js --version
          node dist/cli/main.js list
          node dist/cli/main.js --example donut --once --size 40x16 | grep -q '[@$#]'
          node dist/cli/main.js render --example gem --size 40x16 --frames 8 -o "$RUNNER_TEMP/gem.textel.json"
          node dist/cli/main.js play "$RUNNER_TEMP/gem.textel.json" --once | grep -q '[|/\-]'
